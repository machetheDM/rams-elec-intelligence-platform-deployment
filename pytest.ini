[pytest]
# services/*/test_health.py share the same basename across directories
# (each service is a standalone deployable, not a Python package) — importlib
# mode imports test files by resolved file path instead of a synthesized
# top-level module name, so pytest doesn't raise "import file mismatch"
# when it collects the second, third, and fourth same-named file.
addopts = --import-mode=importlib
testpaths = services

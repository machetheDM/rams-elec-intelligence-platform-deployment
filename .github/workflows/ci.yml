name: Rams @Elec CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-python:
    name: Lint Python (flake8 + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flake8 black
      - run: flake8 services/ etl/ --count --select=E9,F63,F7,F82 --show-source --statistics
      - run: black --check services/ etl/ --diff

  lint-typescript:
    name: Lint TypeScript (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd frontend && npm ci && npm run db:generate && npx eslint . --max-warnings 0

  test-python:
    name: Test Python (pytest + coverage)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rams_elec_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -r services/triage/requirements.txt
          pip install -r services/loadshedding/requirements.txt
          pip install -r services/chatbot/requirements.txt
          pip install -r services/dispatch/requirements.txt
          pip install -r services/sentiment/requirements.txt
          pip install pytest pytest-cov
      - run: pytest services/ tests/ --cov=services --cov=security --cov-report=xml --cov-report=term
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rams_elec_test
          GROQ_API_KEY: test_key
          ESKOM_SE_PUSH_API_KEY: test_key

  # ===========================================================================
  # CrewAI runs in its OWN environment, deliberately.
  # ===========================================================================
  # test-python above installs all four other services' requirements into a
  # single interpreter. CrewAI pulls litellm/instructor/openai/tiktoken, which
  # would have to reconcile with triage's `numpy>=1.26,<2.5` pin (required by
  # shap's numba). Isolating it here keeps that resolution conflict out of the
  # shared job — the containers are already isolated, so CI now matches.
  #
  # services/crew/test_health.py is ALSO collected by test-python, where
  # crewai is absent; its crew-specific tests skip via a CREW_AVAILABLE guard.
  # This job is where they actually execute.
  test-crew:
    name: Test CrewAI Service (isolated env)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -r services/crew/requirements.txt
          pip install pytest
      - run: pytest services/crew/ -v
        env:
          # No GROQ_API_KEY: the crew must degrade to a clean 503 rather than
          # crash, and no test here should ever spend real tokens.
          INTERNAL_API_KEY: rams-elec-frontend-2026

  # ===========================================================================
  # Terraform — AWS root module only, deliberately.
  # ===========================================================================
  # terraform/ (Azure) is excluded. It is a designed-never-provisioned
  # architecture that has never been run through `terraform validate`, so adding
  # it here would fail CI on pre-existing issues rather than on anything changed.
  # Validating and fixing it is its own task; see CLAUDE.md.
  #
  # No credentials are needed or used: `init -backend=false` downloads the
  # provider schema, and `validate` type-checks against it without contacting AWS.
  terraform-aws:
    name: Validate Terraform (AWS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/aws
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # lambda.tf calls filebase64sha256() on the deployment package, and
      # `terraform validate` evaluates that — every input is known, so a missing
      # file is a hard error, not a deferred one. dist/ is git-ignored, so the
      # package has to be built here.
      #
      # Building it rather than stubbing an empty file is the point: it also
      # verifies the cross-platform wheel resolution in build_lambda.py, which is
      # the part most likely to break silently.
      - name: Build Lambda package
        working-directory: .
        run: python scripts/build_lambda.py

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  test-nextjs:
    name: Build Next.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd frontend && npm ci && npm run db:generate && npm run build

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rams-elec-web -f frontend/Dockerfile .
      - run: docker build -t rams-elec-triage -f services/triage/Dockerfile .
      - run: docker build -t rams-elec-dispatch -f services/dispatch/Dockerfile .
      - run: docker build -t rams-elec-loadshedding -f services/loadshedding/Dockerfile .
      - run: docker build -t rams-elec-chatbot -f services/chatbot/Dockerfile .
      - run: docker build -t rams-elec-crew -f services/crew/Dockerfile .
      - run: docker build -t rams-elec-sentiment -f services/sentiment/Dockerfile .
      - run: docker build -t rams-elec-dashboard ./dashboard
      - run: docker build -f docker/Dockerfile.airflow -t rams-elec-airflow ./etl

  # ===========================================================================
  # Security Gate — must pass before deployment
  # ===========================================================================
  security-gate:
    name: "Security Gate"
    runs-on: ubuntu-latest
    needs: [lint-python, lint-typescript, test-python, test-crew, terraform-aws, test-nextjs, docker-build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Security gate check
        run: |
          echo "============================================"
          echo "SECURITY GATE — All CI checks passed"
          echo "============================================"
          echo ""
          echo "  lint-python:    ${{ needs.lint-python.result }}"
          echo "  lint-typescript: ${{ needs.lint-typescript.result }}"
          echo "  test-python:    ${{ needs.test-python.result }}"
          echo "  test-crew:      ${{ needs.test-crew.result }}"
          echo "  terraform-aws:  ${{ needs.terraform-aws.result }}"
          echo "  test-nextjs:    ${{ needs.test-nextjs.result }}"
          echo "  docker-build:   ${{ needs.docker-build.result }}"
          echo ""
          echo "NOTE: Full security scan runs in security.yml workflow."
          echo "Deploy only after security.yml passes with 0 HIGH/CRITICAL findings."
